services:
  mongo:
    image: mongo:7
    container_name: linkvault-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Single-node Kafka in KRaft mode -- no ZooKeeper. One broker is the right
  # size for development; a production topology is a Phase 9 decision.
  kafka:
    image: apache/kafka:3.9.0
    container_name: linkvault-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Pinned rather than left to the image's default, so a restart cannot end
      # up with a cluster id that disagrees with the formatted log directory.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # Two listeners on purpose: HOST is how the API and workers reach the
      # broker while they run on the host machine, DOCKER is how they will
      # reach it once they are containers themselves. Getting this wrong later
      # means a broker that is reachable from exactly one of the two.
      # Bound with an empty host, not 0.0.0.0. The controller listener is
      # deliberately absent from advertised.listeners, and Kafka falls back to
      # `listeners` for it -- an explicit 0.0.0.0 there is rejected outright as
      # a non-routable advertised address, and the broker will not start.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # A single broker cannot replicate anything, so the internal topics have
      # to be told not to try.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No reason to wait for a rebalance window with one consumer per group.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately by the app, with the partition count
      # and retention we actually want. A typo should fail loudly rather than
      # quietly conjure a one-partition topic nothing consumes.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mongo-data:
  kafka-data:

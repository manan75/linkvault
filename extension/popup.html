<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to LinkVault</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <main id="panel">
      <!--
        Focused the moment the popup opens, so the whole interaction is: open,
        Ctrl+V, gone. Nothing above it, nothing to click first.
      -->
      <input
        type="url"
        id="paste"
        class="paste"
        autofocus
        autocomplete="off"
        spellcheck="false"
        placeholder="Paste a link"
        aria-label="Paste a link to save it"
      />

      <p class="status" id="status" role="status"></p>

      <!-- The original reason this extension existed, now the second option. -->
      <section class="current" id="current">
        <p class="section-label">or save the page you are on</p>
        <p class="page-title" id="page-title"></p>
        <p class="page-url" id="page-url"></p>
        <button type="button" id="save" class="quiet">Save this page</button>
      </section>
    </main>

    <footer>
      <a href="#" id="open-options">Settings</a>
    </footer>

    <script type="module" src="src/popup.js"></script>
  </body>
</html>
